# Template only: replace /DATA paths; use frozen split.json, never regenerate per run.
experiment:
  name: simgcd-imagenet100_lt
  seed: 0
  output_dir: outputs/imagenet100_lt
baseline:
  name: simgcd
  configs:
    simgcd:
      num_mlp_layers: 3
      hidden_dim: 2048
      bottleneck_dim: 256
      use_bn: false
      norm_last_layer: true
      sup_weight: 0.35
      memax_weight: 2.0
      student_temp: 0.1
      contrastive_temp: 1.0
      supervised_contrastive_temp: 0.07
      warmup_teacher_temp: 0.07
      teacher_temp: 0.04
      warmup_teacher_temp_epochs: 30
      distribution_estimate_interval: 10
method:
  name: prototail
  enabled: false
  config:
    num_slots: 3
    part_weight: 0.5
    part_loss_weight: 0.5
    temperature: 0.1
    gate_regularization_weight: 0.05
    capacity_regularization_weight: 0.05
    capacity_target_mode: frequency
    learning_rate: 0.05
    gate_learning_rate: 0.01
    shared_backbone_learning_rate: 0.01
    prototype_warmup_epochs: 30
    known_prototype_end_epoch: 60
    novel_prototype_end_epoch: 60
    prototype_momentum: 0.99
    pseudo_confidence: 0.7
    use_spatial_loss: false
data:
  name: imagenet100_lt
  root: /DATA/ImageNet
  manifest_dir: /DATA/prototail_manifests/imagenet100_lt
  image_size: 224
  crop_pct: 0.875
  eval_batch_size: 256
  protocol:
    name: imagenet100_lt_manifest_v1
    known_class_count: 50
    imbalance_ratio: 256
model:
  backbone: dinov2_vitb14
  pretrained: true
  finetune_from_block: 11
optimization:
  epochs: 200
  batch_size: 128
  num_workers: 8
  num_views: 2
  learning_rate: 0.1
  momentum: 0.9
  weight_decay: 0.0001
  scheduler_min_lr_ratio: 0.001
evaluation:
  interval: 5
  metric: v2
