[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "prototail-gcd"
version = "0.1.0"
description = "Composable research framework for ProtoTail and GCD baselines"
requires-python = ">=3.10"

[project.optional-dependencies]
simgcd = [
	"numpy",
	"pandas",
	"pyyaml",
	"scikit-learn",
	"scipy",
	"torch",
	"torchvision",
	"tqdm",
]
bacon = [
	"numpy",
	"pandas",
	"pyyaml",
	"scikit-learn",
	"scipy",
	"torch",
	"torchvision",
	"tqdm",
]

[tool.setuptools.packages.find]
where = ["src"]